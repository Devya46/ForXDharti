<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolveX</title>
    <link rel="shortcut icon" href="Photos/logo-1.png" type="image/x-icon" />
    <style>
      /* ---------- RESET & BASE ---------- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0a0b10;
        color: #fff;
      }

      /* ---------- NAVBAR SHELL (initial transparent over hero) ---------- */
      .site-header {
        width: 100%;
        height: 67px;
        background: transparent; /* start transparent */
        border-top: 1px solid #25262c;
        border-bottom: 1px solid #646600ab;
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        z-index: 1000;
        transition:
          background 0.25s ease,
          border-color 0.2s ease;
      }

      /* scrolled state – solid black */
      .site-header.scrolled {
        background: #000000; /* fully black on scroll */
        border-bottom-color: #3a3b3f;
      }

      .header-container {
        width: 100%;
        max-width: 1580px;
        height: 100%;
        padding: 0 86px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      /* ---------- BRAND ---------- */
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: #ffffff;
        flex-shrink: 0;
      }

      .brand-logo {
        width: 41px;
        height: 48px;
        object-fit: contain;
        display: block;
        filter: brightness(1.3);
      }

      .brand-wordmark {
        font-size: 20px;
        line-height: 0;
        font-weight: 700;
        letter-spacing: -0.8px;
        color: #f5f5f5;
      }

      .brand-wordmark .accent {
        color: #d9ad2f;
      }

      /* ---------- DESKTOP NAV ---------- */
      .primary-nav {
        display: flex;
        align-items: center;
        gap: 40px;
        height: 100%;
      }

      .nav-link {
        height: 100%;
        display: flex;
        align-items: center;
        text-decoration: none;
        color: #c9c9ce;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        transition:
          color 0.2s ease,
          opacity 0.2s ease;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .nav-link:hover {
        color: #ffffff;
      }

      /* ---------- RIGHT ACTIONS ---------- */
      .action-group {
        display: flex;
        align-items: center;
        gap: 36px;
        flex-shrink: 0;
      }

      .portal-badge {
        height: 32px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #76580b;
        border-radius: 5px;
        background: rgba(111, 79, 0, 0.12);
        color: #e8b400;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .portal-badge:hover {
        background: rgba(217, 173, 47, 0.15);
        border-color: #c99b22;
      }

      .login-link {
        color: #c9c9ce;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.2s ease;
      }

      .login-link:hover {
        color: #ffffff;
      }

      .cta-start {
        height: 37px;
        min-width: 125px;
        padding: 0 23px;
        border-radius: 11px;
        background: #d8a511;
        color: #08090d;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .cta-start:hover {
        background: #e6bd45;
        transform: translateY(-1px);
      }

      /* ---------- MOBILE TOGGLE ---------- */
      .hamburger {
        display: none;
        width: 44px;
        height: 44px;
        border: 1px solid #2b2c32;
        border-radius: 8px;
        background: #111218;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 5px;
      }

      .hamburger-line {
        width: 20px;
        height: 2px;
        background: #d9ad2f;
        border-radius: 2px;
        transition: all 0.25s ease;
      }

      /* ---------- MOBILE MENU ---------- */
      .mobile-drawer {
        display: none;
        position: absolute;
        top: 81px;
        left: 0;
        width: 100%;
        background: #0a0b10;
        border-bottom: 1px solid #25262c;
        padding: 15px 25px 25px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
      }

      .mobile-drawer a {
        display: block;
        padding: 15px 0;
        color: #c9c9ce;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        border-bottom: 1px solid #1d1e24;
      }

      .mobile-drawer a:last-child {
        border-bottom: none;
      }

      .mobile-drawer .mobile-cta {
        margin-top: 15px;
        text-align: center;
        background: #d9ad2f;
        color: #08090d;
        border-radius: 9px;
        padding: 13px;
      }

      .mobile-drawer.open {
        display: block;
      }

      /* ---------- RESPONSIVE ---------- */
      @media (max-width: 1150px) {
        .primary-nav {
          gap: 25px;
          margin-right: 30px;
        }

        .action-group {
          gap: 20px;
        }

        .header-container {
          padding: 0 30px;
        }
      }

      @media (max-width: 950px) {
        .primary-nav,
        .action-group {
          display: none;
        }

        .hamburger {
          display: flex;
        }

        .header-container {
          padding: 0 24px;
        }
      }

      @media (max-width: 500px) {
        .site-header {
          height: 72px;
        }

        .header-container {
          padding: 0 16px;
        }

        .brand-logo {
          width: 48px;
          height: 48px;
        }

        .brand-wordmark {
          font-size: 23px;
        }

        .mobile-drawer {
          top: 72px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================
         SITE HEADER (initial transparent)
    ========================= -->
    <header class="site-header" id="siteHeader">
      <div class="header-container">
        <!-- BRAND -->
        <a href="#" class="brand">
          <img
            class="brand-logo"
            src="Photos/logo-1.png"
            alt="WorldofForex logo"
          />
          <div class="brand-wordmark">SOLVE<span class="accent">X</span></div>
        </a>

        <!-- DESKTOP NAVIGATION -->
        <nav class="primary-nav">
          <a href="#" class="nav-link">Home</a>
          <a href="#" class="nav-link">Live Charts</a>
          <a href="#" class="nav-link">Packages</a>
          <a href="#" class="nav-link">Trading Engine</a>
          <a href="#" class="nav-link">Investors</a>
        </nav>

        <!-- RIGHT ACTIONS -->
        <div class="action-group">
          <!-- <a href="#" class="portal-badge">Investor Portal</a> -->
          <a href="#" class="login-link">Login</a>
          <a href="#" class="cta-start">Start Now</a>
        </div>

        <!-- MOBILE MENU TOGGLE -->
        <button
          class="hamburger"
          id="menuToggle"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>

      <!-- MOBILE MENU -->
      <div class="mobile-drawer" id="mobileMenu">
        <a href="#">Home</a>
        <a href="#">Live Charts</a>
        <a href="#">Packages</a>
        <a href="#">Trading Engine</a>
        <a href="#">Investors</a>
        <a href="#">Investor Portal</a>
        <a href="#">Login</a>
        <a href="#" class="mobile-cta">Start Now</a>
      </div>
    </header>

    <!-- =========================
         SCRIPT (menu + scroll effect)
    ========================= -->
    <script>
      // ----- MOBILE MENU TOGGLE (unchanged) -----
      const menuToggle = document.getElementById("menuToggle");
      const mobileMenu = document.getElementById("mobileMenu");

      menuToggle.addEventListener("click", function () {
        mobileMenu.classList.toggle("open");

        const isOpen = mobileMenu.classList.contains("open");
        menuToggle.setAttribute("aria-expanded", isOpen);

        const lines = menuToggle.querySelectorAll(".hamburger-line");

        if (isOpen) {
          lines[0].style.transform = "rotate(45deg) translate(5px, 5px)";
          lines[1].style.opacity = "0";
          lines[2].style.transform = "rotate(-45deg) translate(5px, -5px)";
        } else {
          lines[0].style.transform = "";
          lines[1].style.opacity = "1";
          lines[2].style.transform = "";
        }
      });

      // ----- SCROLL DETECTION: change header to black after scroll -----
      const header = document.getElementById("siteHeader");
      const heroSection = document.querySelector(".hero");

      function updateHeaderBackground() {
        // If the user has scrolled past the hero (or more than 50px),
        // add the .scrolled class to make header black.
        if (window.scrollY > 50) {
          header.classList.add("scrolled");
        } else {
          header.classList.remove("scrolled");
        }
      }

      // Initial check on page load (in case the page is loaded scrolled)
      updateHeaderBackground();

      // Listen to scroll events
      window.addEventListener("scroll", updateHeaderBackground);

      // Optional: Also update on resize (not necessary but harmless)
      window.addEventListener("resize", updateHeaderBackground);
    </script>
  </body>
</html>
